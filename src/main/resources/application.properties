
spring.flyway.locations=classpath:db/migration

spring.datasource.url=jdbc:mysql://localhost:3306/lunalash?useSSL=false&serverTimezone=Asia/Taipei
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.profiles.active=local

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

jwt.secret=${ADMIN_PASSWORD}
jwt.expiration=86400000

cloudinary.cloud-name=${cloudinaryCloudName}
cloudinary.api-key=${cloudinaryApiKey}
cloudinary.api-secret=${cloudinaryApiSecret}

google.oauth.client-id=${GOOGLE_CLIENT_ID}

# 預約通知信：用 Gmail SMTP，帳號需到 Google 帳戶設定申請「應用程式密碼」(不是一般登入密碼)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from-name=${MAIL_FROM_NAME:LunaLash 美睫工作室}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173}
